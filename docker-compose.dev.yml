services:
  postgres:
    image: postgres:17-alpine
    container_name: ai-interviewer-db-dev
    environment:
      POSTGRES_DB: ai_interviewer
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ai_interviewer"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    image: maven:3.9.6-eclipse-temurin-21
    container_name: ai-interviewer-server-dev
    working_dir: /app
    env_file:
      - ./server/.env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ai_interviewer
      DB_USERNAME: admin
      DB_PASSWORD: admin
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
      SPRING_DEVTOOLS_LIVERELOAD_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./server:/app
      - maven_repo:/root/.m2
      - uploads_dev:/app/uploads
    command: mvn spring-boot:run

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: ai-interviewer-client-dev
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api
    depends_on:
      - server
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules

volumes:
  postgres_data_dev:
  maven_repo:
  uploads_dev:
  client_node_modules:
