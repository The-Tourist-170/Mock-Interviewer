services:
  postgres:
    image: postgres:17-alpine
    container_name: ai-interviewer-db
    environment:
      POSTGRES_DB: ai_interviewer
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ai_interviewer"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ai-interviewer-server
    env_file:
      - ./server/.env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ai_interviewer
      DB_USERNAME: admin
      DB_PASSWORD: admin
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://127.0.0.1
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: ai-interviewer-client
    depends_on:
      - server
    ports:
      - "80:80"

volumes:
  postgres_data:
  uploads:
