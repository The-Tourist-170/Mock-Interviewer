spring.application.name=server

server.port=8080

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

file.upload-dir=./uploads

gemini.api-key=${GEMINI_API_KEY}
gemini.model-name=${GEMINI_MODEL_NAME}

ai.provider=${AI_PROVIDER:gemini}
ai.api-key=${AI_API_KEY:}
ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
ai.model=${AI_MODEL:gpt-4o}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://ai-mern-interviewer.web.app,http://localhost:5173,http://127.0.0.1:5173}